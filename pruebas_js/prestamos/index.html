<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Gestion de prestamos</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script type="module" src="index.js"></script>
    </head>
    <body class="bg-light">
        <div class="container py-4">
            <div class="text-center mb-4">
                <h1 class="display-5 fw-bold text-dark">Gestión de préstamos</h1>
                <p class="text-muted">Registra tus préstamos y consulta rápidamente los resultados.</p>
            </div>
            <div class="container p-4 bg-white border rounded-4 shadow-sm">
                <div class="row g-3 align-items-center">
                    <div class="col-md-4">
                        <span></span>
                    </div>
                    <div class="col-md-3">
                        <p class="text-center mb-0 fw-semibold">¿Cuántos préstamos desea registrar?</p>
                    </div>
                    <div class="col-md-3">
                        <input type="number" id="numPrestamos" class="form-control" min="1" placeholder="Ej. 3">
                    </div>
                    <div class="col-md-2 d-grid gap-2">
                        <button type="button" class="btn btn-dark w-100" id="btnPrestamos">Cargar préstamos</button>
                        <button type="button" class="btn btn-outline-secondary w-100" id="btnLimpiar">Limpiar</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="container mt-3 p-3 bg-light border rounded-3 shadow-sm" id="listado"></div>
        <div class="container mt-3 p-3 bg-light border rounded-3 shadow-sm" id="maximos"></div>
        <div class="container mt-3 p-3 bg-light border rounded-3 shadow-sm" id="minimos"></div>
        <div class="container mt-3 p-3 bg-light border rounded-3 shadow-sm" id="promedios"></div> 
    </body>
</html>
